# Build OpenWV on Windows and upload the resulting DLL artifact.
# If embedded.wvd is present in the repo root, it will be used.
# If not present, the workflow will try to decode EMBEDDED_WVD_BASE64 secret.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-windows:
    name: Build OpenWV (Windows x86_64)
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: stable

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Cache Cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install LLVM (clang) via Chocolatey
        shell: powershell
        run: |
          choco install llvm -y --no-progress
          $llvm = 'C:\Program Files\LLVM\bin'
          Write-Host "Adding $llvm to PATH"
          $env:PATH = "$llvm;$env:PATH"
          Write-Host "clang version:"
          clang --version

      - name: Setup Rust (stable)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Ensure embedded.wvd is present (repo preferred, secret fallback)
        shell: powershell
        run: |
          if (Test-Path -Path 'embedded.wvd') {
            Write-Host "embedded.wvd already present in repository root."
            Write-Host "Size (bytes): $(Get-Item 'embedded.wvd').Length"
          } else {
            if (-not $env:EMBEDDED_WVD_BASE64) {
              Write-Error "embedded.wvd not found in repo and secret EMBEDDED_WVD_BASE64 is not set. Add embedded.wvd to repo root or create the secret."
              exit 1
            }
            [IO.File]::WriteAllBytes('embedded.wvd', [Convert]::FromBase64String($env:EMBEDDED_WVD_BASE64))
            Write-Host "embedded.wvd written from secret."
            Write-Host "Size (bytes): $(Get-Item 'embedded.wvd').Length"
          }

      - name: Build (cargo release)
        shell: powershell
        run: |
          cargo build --release

      - name: Show produced files in target/release
        shell: powershell
        run: |
          Get-ChildItem -Path target\release -File | Select-Object Name,Length

      - name: Upload built DLL(s)
        uses: actions/upload-artifact@v4
        with:
          name: openwv-windows-artifacts
          path: target/release/*.dll
