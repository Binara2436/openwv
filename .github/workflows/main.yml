name: Build OpenWV (Windows)

on:
workflow_dispatch:

jobs:
build:
runs-on: windows-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      submodules: recursive

  - name: Install Rust
    uses: actions-rs/toolchain@v1
    with:
      toolchain: stable
      override: true

  - name: Build OpenWV
    run: cargo build --release

  - name: Upload DLL
    uses: actions/upload-artifact@v4
    with:
      name: openwv-windows
      path: target/release/widevinecdm.dll
```
