name: Build OpenWV for Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          C:\vcpkg\installed
          C:\vcpkg\packages
          C:\vcpkg\buildtrees
        key: vcpkg-${{ runner.os }}-protobuf-openssl-gtest
        restore-keys: |
          vcpkg-${{ runner.os }}-

    - name: Install dependencies via vcpkg
      run: |
        cd C:\vcpkg
        # These are cheap if already built and cached
        .\bootstrap-vcpkg.bat
        .\vcpkg install protobuf:x64-windows openssl:x64-windows gtest:x64-windows
