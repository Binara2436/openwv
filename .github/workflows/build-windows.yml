name: Build OpenWV for Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: List repository contents
      run: |
        Write-Host "=== Repository root contents ==="
        Get-ChildItem -Force
        Write-Host ""
        Write-Host "=== Looking for build files ==="
        Get-ChildItem -Recurse -Name -Include "CMakeLists.txt","meson.build","Makefile","*.sln","configure*" 2>$null

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install dependencies via vcpkg
      run: |
        # Use built-in vcpkg
        cd C:\vcpkg
        git pull
        .\bootstrap-vcpkg.bat
        .\vcpkg integrate install
        .\vcpkg install protobuf:x64-windows
        .\vcpkg install openssl:x64-windows
        .\vcpkg install gtest:x64-windows

    - name: Configure with CMake
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
          -DCMAKE_BUILD_TYPE=Release

    - name: Build with CMake
      run: |
        cmake --build build --config Release --verbose

    - name: List build output
      run: |
        Write-Host "=== Full build directory contents ==="
        Get-ChildItem -Path build -Recurse -Force | Select-Object FullName, Length

    - name: Upload entire build folder
      uses: actions/upload-artifact@v4
      with:
        name: openwv-windows-full-build
        path: build/
        if-no-files-found: warn

    - name: Upload binaries only
      uses: actions/upload-artifact@v4
      with:
        name: openwv-windows-binaries
        path: |
          build/**/*.exe
          build/**/*.dll
          build/**/*.lib
          build/**/*.pdb
          build/Release/
        if-no-files-found: warn
