name: Build OpenWV for Windows (MSVC)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Lets you manually trigger the build anytime

jobs:
  build-windows-msvc:
    runs-on: windows-latest
    
    steps:
    # 1. Check out your code using the latest supported action
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Setup vcpkg (official Microsoft package manager for C++ dependencies)
    - name: Setup vcpkg
      uses: microsoft/vcpkg-action@v1
      with:
        vcpkg-version: latest

    # 3. Install all required dependencies for OpenWV
    - name: Install build dependencies
      run: vcpkg install openssl:x64-windows curl:x64-windows protobuf:x64-windows

    # 4. Setup Visual Studio MSBuild tools
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 5. Configure CMake project
    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_INSTALLATION_ROOT }}/scripts/buildsystems/vcpkg.cmake -A x64

    # 6. Compile the project in Release mode
    - name: Build OpenWV
      run: |
        cd build
        msbuild openwv.sln /p:Configuration=Release /m

    # 7. Upload finished build files using the latest supported artifact action
    - name: Upload Release build
      uses: actions/upload-artifact@v4
      with:
        name: openwv-windows-msvc
        path: build/Release/
        if-no-files-found: error # Fails early if build produced no files
